services:
  legacy-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: deltadb
      POSTGRES_USER: legacy
      POSTGRES_PASSWORD: legacy_pass
    ports:
      - "5433:5432"
    volumes:
      - ./test/init-legacy:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legacy -d deltadb"]
      interval: 3s
      timeout: 3s
      retries: 10

  new-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: deltadb
      POSTGRES_USER: novo
      POSTGRES_PASSWORD: "novo_pass#123"
    ports:
      - "5434:5432"
    volumes:
      - ./test/init-new:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novo -d deltadb"]
      interval: 3s
      timeout: 3s
      retries: 10

  rpa:
    build: .
    container_name: delta-rpa-test
    env_file:
      - .env.test
    depends_on:
      legacy-db:
        condition: service_healthy
      new-db:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./state:/app/state
    command: ["python", "/app/app/main.py"]
