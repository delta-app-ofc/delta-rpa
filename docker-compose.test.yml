services:
  legacy-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: deltadb
      POSTGRES_USER: legacy
      POSTGRES_PASSWORD: legacy_pass
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./test/init-legacy:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legacy -d deltadb"]
      interval: 3s
      timeout: 3s
      retries: 10

  new-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: deltadb
      POSTGRES_USER: novo
      POSTGRES_PASSWORD: "novo_pass#123"
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - ./test/init-new:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novo -d deltadb"]
      interval: 3s
      timeout: 3s
      retries: 10

  rpa:
    build: .
    env_file:
      - .env.test
    environment:
      FIRST_YEAR_DB_HOST: legacy-db
      FIRST_YEAR_DB_PORT: 5432
      FIRST_YEAR_DB_NAME: deltadb
      FIRST_YEAR_DB_USER: legacy
      FIRST_YEAR_DB_PASSWORD: legacy_pass
      SECOND_YEAR_DB_HOST: new-db
      SECOND_YEAR_DB_PORT: 5432
      SECOND_YEAR_DB_NAME: deltadb
      SECOND_YEAR_DB_USER: novo
      SECOND_YEAR_DB_PASSWORD: "novo_pass#123"
    depends_on:
      legacy-db:
        condition: service_healthy
      new-db:
        condition: service_healthy
    volumes:
      - test-logs:/app/logs
      - test-state:/app/state
    command: ["python", "/app/app/main.py"]

volumes:
  test-logs:
  test-state:
